<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JJ-Security - Registro</title>
    <!-- Vinculamos al CSS de registro -->
    <link rel="stylesheet" href="../css/registro.css">
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- SIDEBAR (Misma lógica que Login) -->
    <aside class="barra-lateral">
        <div class="logo-sidebar">
            <a href="main.html">
                <img src="../../public/images/logo.jpg" alt="JJ-Security Logo" />
            </a>
        </div>
        
        <div class="icono-menu ajustes">
            <div class="icono-contenido">
                <img src="../../public/images/ajustes.jpg" alt="Ajustes">
                <span>Ajustes</span>
            </div>
        </div>
        <div class="icono-menu filtros">
            <div class="icono-contenido">
                <img src="../../public/images/filtros.jpg" alt="Filtros">
                <span>Filtros</span>
            </div>
        </div>
        <div class="icono-menu usuario">
            <div class="icono-contenido">
                <img src="../../public/images/usuario.jpg" alt="Usuario">
                <span>Usuario</span>
            </div>
        </div>

        <div class="icono-menu ayuda">
            <div class="icono-contenido">
                <img src="../../public/images/mingcute_phone-fill.svg" alt="Soporte">
                <span>Soporte</span>
            </div>
        </div>
    </aside>

    <!-- HEADER -->
    <header>
        <h1>JJ-SECURITY</h1>
        <div class="header-icons"></div>
    </header>

    <!-- MAIN CONTENT -->
    <main>
        <div class="contenido-fondo login-page-container">
            
            <div class="login-box">
                <!-- Título cambiado a Registro -->
                <h2 class="login-title">Registro</h2>
                
                <form action="main.html" method="POST">
                    
                    <!-- Campo NOMBRE (Nuevo) -->
                    <div class="form-group">
                        <label for="nombre">Nombre:</label>
                        <input type="text" id="nombre" name="nombre" required>
                    </div>

                    <!-- Campo CORREO -->
                    <div class="form-group">
                        <label for="correo">Correo:</label>
                        <input type="email" id="correo" name="correo" required>
                    </div>

                    <!-- Campo TELÉFONO (Nuevo) -->
                    <div class="form-group">
                        <label for="telefono">Teléfono:</label>
                        <input type="tel" id="telefono" name="telefono" required>
                    </div>

                    <!-- Campo CONTRASEÑA -->
                    <div class="form-group">
                        <label for="password">Contraseña:</label>
                        <input type="password" id="password" name="password" required>
                    </div>

                    <!-- Campo CONFIRMAR CONTRASEÑA (Nuevo) -->
                    <div class="form-group">
                        <label for="confirm_password">Confirmar Contraseña:</label>
                        <input type="password" id="confirm_password" name="confirm_password" required>
                    </div>

                    <div class="legal-text">
                        <p>Al continuar, aceptas las <a href="#">Condiciones de uso</a> y el <a href="#">Aviso de privacidad</a> de JJ-Security</p>
                    </div>

                    <div class="botones-accion">
                        <!-- El botón Atrás lleva al Login -->
                        <button type="button" class="btn btn-atras" onclick="window.location.href='login.html'">ATRAS</button>
                        <!-- Continuar lleva al Main (simulado) -->
                        <button type="submit" class="btn btn-continuar" onclick="window.location.href='main.html'">CONTINUAR</button>
                    </div>

                    <!-- En registro solemos quitar el botón de abajo extra, o poner "Ya tengo cuenta" -->
                </form>
            </div>

        </div>
    </main>

    <!-- FOOTER -->
    <footer>
        <div class="contenido-footer">
            <div class="footer-links">
                <a href="#">Condiciones de uso</a>
                <a href="#">Área legal</a>
                <a href="#">Aviso de privacidad</a>
                <a href="#">Cookies</a>
            </div>

            <div class="copyright">
                &copy; 1996-2025, JJ-Security.com, Inc. o sus afiliados
            </div>

            <div class="footer-contacto">
                <img src="./images/mingcute_phone-fill.svg" alt="Teléfono">
                <span>24/7</span>
            </div>
        </div>
    </footer>

</body>
</html>
