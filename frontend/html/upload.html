<!DOCTYPE html>
<html lang="ca">
  <head>
    <meta charset="UTF-8" />
    <title>Pujar Fitxer Excel</title>
  </head>
  <body>
    <h1>Pujar Fitxer Excel (.xlsx, .xls, .csv)</h1>
    <form action="../../backend/upload.php" method="POST" enctype="multipart/form-data">
      <label for="fitxer">Tria un fitxer:</label>
      <input type="file" name="fitxer" id="fitxer" accept=".xlsx,.xls,.csv" required />
      <br /><br />
      <button type="submit">Pujar Fitxer</button>
    </form>
  </body>
</html>
